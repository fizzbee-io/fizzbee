name: Docker

# Publishes ghcr.io/<repo> as a thin wrapper around the official release
# tarballs. Triggers:
# - release published: builds the image for that release version. (Not on
#   tag push — the Release workflow is still uploading assets at that
#   point; the `published` event fires after assets exist.)
# - monthly cron: re-downloads the LATEST release onto a freshly pulled
#   base image, so OS-layer CVE patches reach `latest` without a fizzbee
#   release.
# - manual dispatch: optional explicit version.
#
# Tag policy: `latest` moves only when the version being published IS
# the newest GitHub release (new releases, monthly rebuilds, and manual
# rebuilds of the newest release). A manual rebuild of an OLDER release
# (e.g. to refresh its base image for CVE fixes) republishes only its
# semver tag, so `latest` never regresses to older fizzbee code.
on:
  release:
    types: [published]
  schedule:
    - cron: "17 8 3 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to package (e.g. v0.5.3); defaults to latest release"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve fizzbee version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.version || '' }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Accept "0.5.3" as well as "v0.5.3": release tags carry the v
            # prefix, and both the tarball URL and the latest-comparison
            # below use the tag verbatim.
            case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac
            # Fail here with a clear message rather than deep inside the
            # docker build with a urlretrieve 404 traceback.
            gh release view --repo ${{ github.repository }} "$VERSION" --json tagName >/dev/null \
              || { echo "::error::no release tagged $VERSION in ${{ github.repository }}"; exit 1; }
          else
            VERSION="$LATEST"
          fi
          echo "version=$VERSION" | tee -a "$GITHUB_OUTPUT"
          # strip leading v for the semver image tags
          echo "semver=${VERSION#v}" | tee -a "$GITHUB_OUTPUT"
          # `latest` only when this IS the newest release (see tag policy above)
          TAGS="ghcr.io/${{ github.repository }}:${VERSION#v}"
          if [ "$VERSION" = "$LATEST" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:latest"
          else
            echo "::notice::$VERSION is older than $LATEST; publishing only the semver tag (not latest)"
          fi
          echo "tags=$TAGS" | tee -a "$GITHUB_OUTPUT"

      - name: Set up QEMU (for the arm64 smoke test)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fizzbee:smoke-amd64
          build-args: |
            FIZZBEE_VERSION=${{ steps.version.outputs.version }}

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: fizzbee:smoke-arm64
          build-args: |
            FIZZBEE_VERSION=${{ steps.version.outputs.version }}

      # NOTE: exit status alone is NOT a sufficient assertion — the fizzbee
      # binary exits 0 even when the model checker reports FAILED, so the
      # PASSED grep is the real check. Two specs: Counter is the minimal
      # sanity check; two-phase-commit exercises roles, functions, and much
      # more of the parser's python dependency surface (antlr4, protobuf).
      - name: Smoke test (amd64)
        run: |
          set -euo pipefail
          for spec_dir in examples/references/01-02-atomic-action:Counter.fizz \
                          examples/references/13-02-01-two-phase-commit:TwoPhaseCommit.fizz; do
            dir="${spec_dir%%:*}"; spec="${spec_dir##*:}"
            docker run --rm -v "$PWD/$dir":/workspace fizzbee:smoke-amd64 "$spec" | tee /tmp/smoke.out
            grep -q "PASSED: Model checker completed successfully" /tmp/smoke.out
          done
          # mbt-scaffold runs the generator on the image's system python
          # (see docker/mbt_gen_launcher.py): generate a real scaffold so
          # the jinja2 templates and the generator's imports are exercised.
          rm -rf /tmp/mbt && mkdir -p /tmp/mbt
          cp examples/references/13-02-01-two-phase-commit/TwoPhaseCommit.fizz /tmp/mbt/
          docker run --rm -v /tmp/mbt:/workspace --entrypoint /opt/fizzbee/fizz fizzbee:smoke-amd64 \
            mbt-scaffold --lang typescript --playwright --out-dir /workspace/out --rel-root /workspace/out TwoPhaseCommit.fizz
          test -s /tmp/mbt/out/two_phase_commit_test.ts
          test -s /tmp/mbt/out/two_phase_commit_adapters.ts

      - name: Smoke test (arm64, via QEMU)
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD/examples/references/01-02-atomic-action":/workspace \
            fizzbee:smoke-arm64 Counter.fizz | tee /tmp/smoke-arm64.out
          grep -q "PASSED: Model checker completed successfully" /tmp/smoke-arm64.out

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FIZZBEE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}

      - name: Verify published manifest lists both architectures
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository }}:${{ steps.version.outputs.semver }}"
          docker buildx imagetools inspect "$ref" | tee /tmp/manifest.out
          grep -q "linux/amd64" /tmp/manifest.out
          grep -q "linux/arm64" /tmp/manifest.out
