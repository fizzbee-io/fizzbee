name: Build

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Build Releases
        run: |
          export FIZZBEE_RELEASE_VERSION=test
          export DISABLE_CLEANUP=true
          ./release/build_release.sh

      - name: Test Releases
        run: |
          ./fizzbee-test-linux_x86/fizz examples/tutorials/00-no-op/Counter.fizz

      - name: Reference example baselines
        run: |
          FIZZ=./fizzbee-test-linux_x86/fizz python3 test_references.py --skip-lovable

      # Only the maintained unit tests run here. The older tests in
      # //lib and //modelchecker have stale expectations and need their
      # own cleanup before they can join.
      - name: Unit tests
        run: |
          bazel test --test_output=errors //modelchecker/liveness/... //parser/... //lib:symmetry_test
          bazel test --test_output=errors //modelchecker:modelchecker_test \
            --test_filter='^(TestFormula|TestExpandAssertionHeaderErrors|TestSccLivenessMatchesCycleFinder|TestPredicateCall|TestModelErrorStackTraceShowsCause|TestCloneSegment|TestOrdinalRespace)'
